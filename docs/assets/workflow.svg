<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-labelledby="title desc"><title id="title">A calmer control centre</title><desc id="desc">Illustrated companion interface with a map run, strategy and account overview. Decorative illustration, not live game data.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#dcece4"/><stop offset="1" stop-color="#f9d9c7"/></linearGradient></defs><rect x="21" y="19" width="558" height="428" rx="38" fill="url(#b)"/><circle cx="499" cy="99" r="89" fill="#fff" opacity=".22"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="49" y="52" width="502" height="335" rx="23" fill="#fff" fill-opacity=".93" stroke="#d9e0d9"/><circle cx="71" cy="74" r="4" fill="#e8987f"/><circle cx="87" cy="74" r="4" fill="#e4c88a"/><circle cx="103" cy="74" r="4" fill="#99b9a6"/><text x="467" y="79" font-size="10" fill="#7e9188">BLOONS+</text><rect x="66" y="100" width="109" height="269" rx="12" fill="#f2f5f1"/><text x="79" y="126" font-size="12" font-weight="700" fill="#29423a">Your next run</text><rect x="76" y="144" width="88" height="29" rx="8" fill="#dae9df"/><text x="85" y="163" font-size="10" fill="#496a59">Specific Map</text><text x="85" y="193" font-size="10" fill="#83978b">Tower progress</text><text x="85" y="219" font-size="10" fill="#83978b">Run logs</text><path d="M82 329h63m-63 10h42" stroke="#c4d3c8" stroke-width="5" stroke-linecap="round"/><text x="198" y="125" font-size="19" font-weight="700" fill="#29423a">Ready when you are.</text><text x="198" y="146" font-size="11" fill="#83978b">Choose a route. See what it needs.</text><rect x="196" y="163" width="337" height="105" rx="13" fill="#f6e7db"/><path d="M209 233c15-20 29-10 44-26s26-20 41-6 24-4 32-15" stroke="#e1b394" stroke-width="8" stroke-linecap="round" fill="none"/><circle cx="242" cy="191" r="13" fill="#aec7ae"/><circle cx="284" cy="244" r="10" fill="#b9cbb3"/><text x="349" y="191" font-size="13" font-weight="600" fill="#725b4a">Map + variation</text><text x="349" y="214" font-size="11" fill="#a38b76">Hero requirements</text><text x="349" y="234" font-size="11" fill="#a38b76">Tower upgrade paths</text><rect x="196" y="282" width="159" height="69" rx="12" fill="#e6eee7"/><rect x="368" y="282" width="165" height="69" rx="12" fill="#edf0f2"/><text x="211" y="306" font-size="10" fill="#7d9785">YOUR ACCOUNT</text><text x="211" y="328" font-size="14" font-weight="600" fill="#43694f">Progress, together</text><text x="385" y="306" font-size="10" fill="#8a96a0">YOUR REPLAY</text><text x="385" y="328" font-size="14" font-weight="600" fill="#5c7482">A clearer timeline</text><rect x="165" y="366" width="270" height="62" rx="18" fill="#263f38"/><circle cx="191" cy="397" r="10" fill="#a7c7b1"/><path d="m187 397 3 3 6-6" stroke="#263f38" stroke-width="2" fill="none"/><text x="213" y="393" font-size="12" font-weight="600" fill="#fff">You stay in control.</text><text x="213" y="410" font-size="10" fill="#b9cfc2">Pause · inspect · stop after replay</text></g></svg>
