<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc"><title id="title">Bloons+ architecture</title><desc id="desc">Main PC JavaScript interface connects by VM bridge to a guest Python replay engine. The engine uses simulated input and screen capture to interact with BTD6. Local save reading is read-only.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#78958b"/></marker></defs><rect width="1000" height="290" rx="24" fill="#f2f6f3"/><g font-family="Segoe UI,Arial,sans-serif" fill="#273e38"><rect x="28" y="56" width="248" height="178" rx="19" fill="white" stroke="#d3ddd7"/><text x="52" y="91" font-size="12" letter-spacing="2" fill="#748b80">MAIN PC</text><text x="52" y="129" font-size="25" font-weight="600">Your overview</text><text x="52" y="162" font-size="16">JavaScript · Electron</text><text x="52" y="190" font-size="14" fill="#708278">Commands, logs, progress</text><path d="M287 145h74" stroke="#78958b" stroke-width="2" marker-end="url(#a)"/><text x="295" y="129" font-size="11" fill="#708278">VM bridge</text><rect x="375" y="56" width="248" height="178" rx="19" fill="white" stroke="#d3ddd7"/><text x="399" y="91" font-size="12" letter-spacing="2" fill="#748b80">WINDOWS GUEST</text><text x="399" y="129" font-size="25" font-weight="600">Replay engine</text><text x="399" y="162" font-size="16">Python · vision · input</text><text x="399" y="190" font-size="14" fill="#708278">Read-only account readers</text><path d="M634 145h74" stroke="#78958b" stroke-width="2" marker-end="url(#a)"/><text x="639" y="121" font-size="11" fill="#708278">Input +</text><text x="639" y="135" font-size="11" fill="#708278">capture</text><rect x="723" y="56" width="248" height="178" rx="19" fill="#f9e9df" stroke="#e6d0c2"/><text x="747" y="91" font-size="12" letter-spacing="2" fill="#9b7661">STEAM</text><text x="747" y="129" font-size="25" font-weight="600">Bloons TD 6</text><text x="747" y="162" font-size="16">Your owned game</text><text x="747" y="190" font-size="14" fill="#8f796c">No game-file edits</text></g></svg>
